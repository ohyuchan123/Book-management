app:
  version: 1.0.1
  name: BookManagement
  description: This is my application

server:
  port: 8080

spring:
  application:
    name: BookManagement
  datasource:
    url: jdbc:h2:~/onedayboot
    driver-class-name: org.h2.Driver
    username: sa
    password: 1234

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true